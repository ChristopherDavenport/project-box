# project-box, pointed at project-box.
#
# Issue #7's shape, taken literally: one repo, one seat, MaxConcurrent 1,
# the gated lane. The factory lands on refs/heads/factory — never main,
# never the branch a human is working on.
#
# Every path here is relative to the REPOSITORY ROOT, which is where
# hack/dogfood/run.sh puts you. The state they name lives in .factory/,
# which .gitignore excludes: the harness is versioned, the store, mirrors,
# workspaces, and socket are not. That split is the only difference between
# this file and the one that ran rounds 1 through 3 from .factory/box.yaml.
#
# The tenant is the outermost scope of every key and every evidence chain.
# Changing it does not rename anything — it starts an empty scope beside the
# existing one and orphans the chain the dogfood has been writing since
# round 1. It is the daemon's identity, and a reload that touches it is
# refused for the same reason.
tenant: davenport
runner: boxd
db: .factory/box.db
root: .factory/forge
listen: unix:.factory/boxd.sock
every: 15s
drain: 60s
build_timeout: 30m

budget:
  # One at a time. Issue #18 (three concurrent runs producing one) is fixed,
  # but the point of the dogfood is the agent, not the lease.
  max_concurrent: 1
  # Sized from measurement, not from hope. Four runs: 1.0M, 5.3M, 7.5M,
  # 20.1M — mean 8.5M. A 6M window admitted 0.7 average runs an hour, so the
  # factory was braked essentially all the time and the number was doing
  # nothing but stopping work. 30M admits about 3.5, which at fifteen to
  # twenty minutes a run is roughly continuous operation for one seat.
  #
  # ~$24/hour at the observed $0.85/M. Hot-reloadable: edit and `kill -HUP`.
  max_tokens_per_window: 30000000
  window: 1h
  # The runaway bound, which the window cannot express: the window gates
  # starts, so its real ceiling is "the limit, plus one whole run". That is
  # how 6M became 25,419,130 in round 3.
  #
  # Set it ABOVE the most expensive legitimate run, not near it. A killed run
  # produces nothing at all, so a ceiling tight enough to truncate real work
  # spends the tokens and throws away the commit — strictly worse than the
  # overshoot it prevents. 25M is the 20.1M measured above plus room; it is
  # here to catch pathology, not to economise.
  max_tokens_per_run: 25000000
  # Deliberately absent: allow_unmetered. A run that will not say what it
  # cost should stop the factory — that is the whole finding from round 1.

boxes:
  - name: pb
    agent: claude-agent-acp
    seat: mason
    # What the builders load. Before this block existed the answer was
    # "whatever ~/.claude has enabled", decided by nobody and recorded
    # nowhere: a probe of this very box found 44 plugins, 79 skills, three
    # hook sets and every authenticated MCP server the machine holds reaching
    # the agent through the adapter's default setting sources.
    harness:
      # Read the machine's enabled set on EVERY run. Enable a plugin in the
      # harness and the next build has it — no reload, no restart. The set is
      # resolved into the bundle before the agent starts, so the agentref
      # says which plugins were loaded even though the machine chose them.
      plugins: user

      # Plugin MCP stays off. This box runs unattended against its own
      # repository; inheriting the machine's knowledge is the point, and
      # inheriting its Slack, Jira, GitHub, Datadog and Honeycomb credentials
      # is not. Servers are granted deliberately under mcp: — none, here,
      # which means the builders have no MCP surface at all.
      plugin_mcp: false

      # Skills by ref: a repo, a commit, a path. They do not live in this
      # repository, so a skill stays governed and versioned where it belongs
      # and is still pinned to an exact tree here. The digest is the tree
      # object at that path in that commit, and it rides the agentref — so
      # "which version of the Go skill was this agent running" is answerable
      # from the evidence chain, not from whatever is on disk today.
      #
      # To add one: name it, pin it, kill -HUP. To move one forward: change
      # the commit. Both are ordinary edits to this file.
      skills:
        - name: go
          repo: https://github.com/christopherdavenport/christopherdavenport-marketplace.git
          commit: 611d9835ec22d3b5ceba07afafc4b3ddce719e1f
          path: backend/go/skills/go
        - name: sqlite
          repo: https://github.com/christopherdavenport/christopherdavenport-marketplace.git
          commit: 611d9835ec22d3b5ceba07afafc4b3ddce719e1f
          path: backend/sqlite/skills/sqlite
    repos:
      - name: project-box
        remote: https://github.com/ChristopherDavenport/project-box.git
        branch: factory
        role: service
        lane: gated
        route: issues
        check: go build ./... && go test ./...
