# project-box, pointed at project-box.
#
# Issue #7's shape, taken literally: one repo, one seat, MaxConcurrent 1,
# the gated lane, landing on refs/heads/factory and never main. Nine rounds
# in, the decision of 2026-09-06 (docs/PLAN.md §6 and §10) moves the landing
# to main: through a pull request the gate has judged and a reviewer's
# judgement has passed, by the same fenced push of the exact built commit,
# with a human approver a requirement of policy that this box sets to zero.
# In force since round 11 (2026-09-06): `branch: main`, `land: pull_request`
# and `review: judgement` below, both landings the flip waited on (#59 and
# #62) being in. TestDogfoodBoxIsNarrow refuses main without both.
#
# Every path here is relative to the REPOSITORY ROOT, which is where
# hack/dogfood/run.sh puts you. The state they name used to live in
# .factory/, inside the checkout — but a workspace under the checkout
# advertises the checkout: its absolute path carries the operator's tree as
# a prefix, and round 10's builder inferred that tree from its own cwd and
# wrote to it (issue #73). So the store, mirrors, workspaces, and socket
# live beside the repository instead, in ../project-box-state/. Gitignore
# is no longer the mechanism keeping state out of the history — there is
# simply nothing under the checkout to ignore.
#
# The tenant is the outermost scope of every key and every evidence chain.
# Changing it does not rename anything — it starts an empty scope beside the
# existing one and orphans the chain the dogfood has been writing since
# round 1. It is the daemon's identity, and a reload that touches it is
# refused for the same reason.
tenant: davenport
runner: boxd
db: ../project-box-state/box.db
root: ../project-box-state/forge
listen: unix:../project-box-state/boxd.sock
every: 15s
drain: 60s
build_timeout: 30m

# The run log: what each agent did while it ran — every tool call and what
# it was doing, what it said, what policy refused — kept beside the chain so
# the room can show a unit's page after the run, not only while it runs.
# Telemetry, pruned by age; thirty days is longer than any round is looked
# at, and a frame is a line, not a record. Absent would keep every frame.
runs:
  keep_for: 720h

budget:
  # Sized from four rounds on a model nobody chose (see `model:` below):
  # 1.0M, 5.3M, 7.5M, 20.1M, then round 4's 25.1M — 98.5% of it cache reads
  # at ~206K of context a call. Neither brake here is the one that bound.
  # The factory runs on a subscription, and a subscription's five-hour
  # window is shared with the human on the same account and invisible to
  # this meter: round 4's one big run consumed it, the next run hit
  # "session limit" five minutes in, and nothing here had refused anything.
  # The agent-result record now carries the account's own limit report
  # (status, window, utilization, reset), which is the currency a brake for
  # that has to be denominated in.
  #
  # Round 5's numbers, sized to not run out mid-round rather than to keep the
  # seat busy: units are narrow and on Sonnet now, and the point is to
  # measure them, not to fill the hour. Four starts an hour, fifteen million
  # tokens of volume, two side by side so the section leases are exercised.
  # Resize from what round 5 shows. Hot-reloadable: edit and `kill -HUP`.
  # Three since round 9: a unit waiting on a section lease holds a seat,
  # so with two seats one wait idles the box for every unit in another
  # section. Three lets a runnable unit run beside a waiting one; the
  # proper fix is a wait that holds no seat.
  # Four since round 11 (2026-09-10): the point of the per-cycle brakes was
  # to measure a round, not to keep the seats busy, and the measurements
  # are in. Round 10 landed nine units for $66 and spent 84 minutes of the
  # round paused at the hourly cap. The overall spend is bounded by
  # `window_reserve` below — the account's own window, the brake that has
  # ever actually bound — so the brakes above it are set to let a round
  # run, and only the runaway ceiling stays near its old size.
  # Three since round 12 (#120): a wait holds no seat now — the pump takes
  # the section lease and the seat together or not at all, so the spare
  # seat round 9 added for a waiter is returned; the account window below
  # stays the brake.
  max_concurrent: 10
  # Five, not four, since round 6: the meter counts a start when the pump
  # acquires it, before the loop tries the section leases, so a unit that
  # only WAITED for a section kept its start and was charged a second one
  # when it finally ran. Round 6's whole-repository unit was refused that
  # way with three real runs behind it. Raised by one until the meter
  # counts runs, not attempts.
  # Twenty since round 8: four issues at once, ten units, a retry and every
  # wait on a section each a start under the double count above. Starts are
  # the brake on a runaway, and four deliberate submissions are not one.
  # Forty since round 11: see max_concurrent.
  # Since round 12 (#120): the meter counts a start only when the builder
  # actually starts now, not when the pump acquires it — the round 6 double
  # count is closed, so a section wait costs neither a seat nor a start.
  max_per_window: 60
  # Twenty-five million since round 9: round 7 and round 8's three planners fell
  # in one clock hour and put it at 19.6M against fifteen, with every unit
  # refused until the hour turned. Volume is still the brake; a round is
  # not a runaway.
  # A hundred million since round 11: round 10 read 129M across a round,
  # most of it cache reads, and paused for 84 minutes of hourly cap at 25M.
  # The window reserve below is the spend brake; this one is volume.
  max_tokens_per_window: 150000000
  window: 1h
  # The brake in the currency that actually bound. The account's five-hour
  # window is shared with the human on this machine and invisible to the
  # meter until a run ends; every run now reports it, and above this share
  # the meter refuses new starts until the window resets. Half is Chris's.
  # `hack/dogfood/window.py` asks the same question before a round starts.
  window_reserve: 0.5
  # This factory runs on the subscription on this machine, which is why
  # window_reserve above is the brake that binds and max_cost_per_window is
  # unset: a subscription prices nothing for a cost ceiling to enforce.
  # Naming it also means a key that turns up in the daemon's environment —
  # by accident, by a shell profile, by anything — stops the box instead of
  # quietly moving every run onto an invoice nobody is watching.
  credential: plan
  # The runaway bound, which the window cannot express: the window gates
  # starts, so its real ceiling is "the limit, plus one whole run". That is
  # how 6M became 25,419,130 in round 3.
  #
  # Set it ABOVE the most expensive legitimate run, not near it. A killed run
  # produces nothing at all, so a ceiling tight enough to truncate real work
  # spends the tokens and throws away the commit — strictly worse than the
  # overshoot it prevents. 25M was round 4's whole-repository run on a
  # million-token window; a unit on Sonnet has a 200K window and a section,
  # so 12M is sixty full-context turns and still only catches pathology.
  # Twenty million since round 8: round 7's one unit for two sections read
  # 11.24M against twelve, and a run killed at the ceiling spends it all and
  # lands nothing. Above the most expensive legitimate run, as the note says.
  # Fifty million since round 11: the planner is on a million-token window
  # now, and a run killed at the ceiling lands nothing.
  max_tokens_per_run: 50000000
  # Deliberately absent: allow_unmetered. A run that will not say what it
  # cost should stop the factory — that is the whole finding from round 1.

boxes:
  - name: pb
    agent: claude-agent-acp
    seat: mason
    # The model, by the value the agent lists for its model option. Left
    # unset, claude-agent-acp runs whatever ~/.claude/settings.json says —
    # on this machine fable[1m], the most expensive model with a
    # million-token window, which is how round 4's #16 run came to re-read
    # ~206K of context on each of 120 calls. Applied through
    # session/set_config_option once the session opens and asserted back:
    # a value the agent does not list fails the run before a prompt is
    # sent, and the agent-session record lists what it offered instead. A
    # session/new probe on 2026-09-04 listed: default, opus[1m],
    # claude-fable-5-1[1m], fable[1m], sonnet, haiku.
    #
    # sonnet: a 200K window bounds what every turn re-reads, and the tier is
    # priced for routine work. Whether it lands this repository's changes is
    # round 5's measurement, not this file's claim.
    model: sonnet
    # The rest of the session by option id, same contract. The same probe
    # showed effort inherited as xhigh; it stays the agent's default until a
    # Sonnet round says what effort buys.
    # session:
    #   effort: high
    # Tiers by role. The planner judges once per origination over a
    # read-only tree; the builder expresses each unit. Both inherit the
    # box's `model:` unless stated here, and a section's or a plan node's
    # tier wins over both. Raise the planner's tier first if plans come back
    # wrong: a bad plan costs every unit under it.
    # Round 6's configuration: effort high on both. Round 5 ran at xhigh,
    # inherited from the machine's settings, and the write-up
    # (docs/experiments/round5-2026-09-04.md) shows output and request count
    # are the levers left — effort is the dial that moves both without
    # touching the model. Applied on the next `kill -HUP`.
    #
    # The planner on Opus since round 10. Rounds 5 through 9 planned on
    # Sonnet for $1.4-2.1 a plan, a tenth of a round's bill, and every plan
    # was one unit with the issue's body folded into its task; the plan is
    # the one judgement every unit under it inherits, and it reads the tree
    # once. Opus is the adapter's `opus[1m]` — the only Opus it lists — so
    # the 200K bound Sonnet gave the builders does not apply here; the
    # planner's context has ended under 125K every round, and
    # max_tokens_per_run is the ceiling if that changes. Fable is the same
    # edit (`fable[1m]`) at twice the price; measure Opus first.
    #
    # Measured: six Opus plans in round 10 cost $1.76-4.05 each and every
    # one was right. The planner moves to Fable 5.1 for round 11
    # (2026-09-10) at effort high — the plan is the one judgement every
    # unit inherits, and a wrong one costs every unit under it, so it gets
    # the strongest tier; the builders stay where they are.
    roles:
      planner: {model: "fable[1m]", session: {effort: high}}
      builder: {session: {effort: high}}
      # The reviewer (review: judgement on the repo below) reads one diff
      # per unit against its origination and PLAN §6; it is the quality
      # gate the decision of 2026-09-06 put in front of main, so it starts
      # on the planner's tier. Round 11 measures what a review costs.
      gate: {model: "opus[1m]", session: {effort: high}}
    # Every issue is planned by judgement before it is work: a graph of
    # units, each with its sections, its dependencies and its tier, recorded
    # on the origination's chain with the model that judged. Opt-in here and
    # nowhere else — the seeded declaration keeps the identity plan, and a
    # box with no agent is refused this at load. A planner that fails parks
    # the origination in the exception queue; retry and resolve reach it
    # from the room like any item.
    kinds:
      - name: issue
        decompose: {decomposer: planner}
        completion: {graph: true}
    # What the builders load. Before this block existed the answer was
    # "whatever ~/.claude has enabled", decided by nobody and recorded
    # nowhere: a probe of this very box found 44 plugins, 79 skills, three
    # hook sets and every authenticated MCP server the machine holds reaching
    # the agent through the adapter's default setting sources.
    harness:
      # Read the machine's enabled set on EVERY run. Enable a plugin in the
      # harness and the next build has it — no reload, no restart. The set is
      # resolved into the bundle before the agent starts, so the agentref
      # says which plugins were loaded even though the machine chose them.
      plugins: user

      # Plugin MCP stays off. This box runs unattended against its own
      # repository; inheriting the machine's knowledge is the point, and
      # inheriting its Slack, Jira, GitHub, Datadog and Honeycomb credentials
      # is not. Servers are granted deliberately under mcp: — none, here,
      # which means the builders have no MCP surface at all.
      plugin_mcp: false

      # Skills by ref: a repo, a commit, a path. They do not live in this
      # repository, so a skill stays governed and versioned where it belongs
      # and is still pinned to an exact tree here. The digest is the tree
      # object at that path in that commit, and it rides the agentref — so
      # "which version of the Go skill was this agent running" is answerable
      # from the evidence chain, not from whatever is on disk today.
      #
      # To add one: name it, pin it, kill -HUP. To move one forward: change
      # the commit. Both are ordinary edits to this file.
      skills:
        - name: go
          repo: https://github.com/christopherdavenport/christopherdavenport-marketplace.git
          commit: 611d9835ec22d3b5ceba07afafc4b3ddce719e1f
          path: backend/go/skills/go
        - name: sqlite
          repo: https://github.com/christopherdavenport/christopherdavenport-marketplace.git
          commit: 611d9835ec22d3b5ceba07afafc4b3ddce719e1f
          path: backend/sqlite/skills/sqlite
    repos:
      - name: project-box
        remote: https://github.com/ChristopherDavenport/project-box.git
        # main, since round 11: both landings the header names are in.
        # refs/heads/factory stays as the record of rounds 1 through 10.
        branch: main
        role: service
        lane: gated
        route: issues
        check: ./hack/check.sh
        # Issue #22's lander, turned on for the box that builds this
        # repository: the factory opens a real GitHub pull request against
        # the driving issue and lands through it, rather than a bare fenced
        # push to refs/heads/factory. The token comes from the `gh` session
        # on this machine — a stopgap ahead of the Phase 7 GitHub App.
        # Was off for the rest of round 9: the lander titled the request
        # with the unit's task and GitHub refuses a title over 256 characters
        # (#59, landed d9b4607). On for good with `branch: main`: main is
        # reached through a pull request or not at all.
        land: pull_request
        land_token: gh
        # The judgement before the push (#62): the gate-role reviewer reads
        # the diff against the origination and PLAN §6 after the command
        # gate and before the land, and posts box/review on the request. An
        # absent judgement is not a pass. Its tier is roles.gate above.
        review: judgement
        # No approval: block — count zero, machine-gated, the common case.
        # An installation whose boundary wants a person names
        # `approval: {count: N}` here (#66) and the request waits for that
        # many distinct, non-self reviews of the exact built head.
        # Where work is expressed. A unit names the sections its paths fall
        # in; two units in disjoint sections run at once, two in one take
        # turns, and a unit that names none is the whole repository and waits
        # for all of them. The builder is told its section's paths and runs
        # the section's check while iterating; the repository's full check
        # above still runs at the gate. Paths not covered by any section are
        # reached only by a whole-repository unit.
        # Redrawn per #200 on the co-change evidence: loop/pump/queue change
        # together, plan/ingress/kind change apart from them, and capacity
        # changes apart from both — seven packages are no longer one lease.
        sections:
          - name: forge
            purpose: git mirrors, leases, workspaces, landing
            paths: [internal/forge]
            check: go test ./internal/forge/...
          - name: loop
            purpose: the unit's transaction — queue, claim, build, gate, land
            paths: [internal/loop, internal/queue, internal/pump]
            check: go test ./internal/loop/... ./internal/queue/... ./internal/pump/...
          - name: intake
            purpose: how work arrives and becomes a plan — ingress, kinds, plans
            paths: [internal/plan, internal/ingress, internal/kind]
            check: go test ./internal/plan/... ./internal/ingress/... ./internal/kind/...
          - name: capacity
            purpose: the meter — windows, budgets, seats
            paths: [internal/capacity]
            check: go test ./internal/capacity/...
          - name: agent
            purpose: the agent plane — layers, the ACP runtime, harness, seats, knowledge
            paths: [internal/agent, internal/harness, internal/seat, internal/knowledge]
            check: go test ./internal/agent/... ./internal/harness/... ./internal/seat/... ./internal/knowledge/...
          - name: evidence
            purpose: the chain and the store beneath it
            paths: [internal/evidence, internal/store]
            check: go test ./internal/evidence/... ./internal/store/...
          - name: daemon
            purpose: boxd, its API and gateway, box.yaml, the control room's server side
            paths: [internal/daemon, internal/api, internal/gateway, internal/boxcfg, internal/control, internal/boxctx, internal/version, cmd]
            check: go test ./internal/daemon/... ./internal/api/... ./internal/gateway/... ./internal/boxcfg/... ./internal/control/... ./cmd/...
          - name: deploy
            purpose: the estate, rendering, the ladder, campaigns, checks
            paths: [internal/deploy, internal/render, internal/ladder, internal/estate, internal/campaign, internal/checks, deploy]
            check: go test ./internal/deploy/... ./internal/render/... ./internal/ladder/... ./internal/estate/... ./internal/campaign/... ./internal/checks/...
          - name: room
            purpose: the web control room
            paths: [web]
            check: cd web && npm run build
          - name: docs
            purpose: the design record and the briefs
            paths: [docs, README.md, CLAUDE.md]
            check: "true"
    # Self-deploy, turned on since round 12: it waited "until one landing has
    # been watched" (#64, round 10), and twenty-five have been watched since
    # the 2026-09-12 16:41 restart while the box ran none of them — the wait
    # is over. A deploy stops claims, waits for running work to settle
    # exactly as restart.sh does, checks and rebuilds the daemon at main's
    # new head, re-execs on the same socket and store, and rolls back —
    # parking a deploy exception — if the new binary fails to come up. Gated
    # to the seven sections whose landings can actually change the daemon's
    # own tree; a landing in docs or room does not restart it.
    self_deploy:
      from: main
      sections: [daemon, loop, agent, forge, evidence, intake, capacity]
