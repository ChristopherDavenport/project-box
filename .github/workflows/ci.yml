# Every gate blocks, and this file is itself under change control — the claim
# "our storage properties are asserted on every backend on every commit" is a
# control, and controls have to be sampleable.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# The job reads the tree and nothing else. Without this block the token
# carries whatever the repository's default grants, and on a public
# repository a workflow is code anyone can propose.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The Spanner conformance leg is REQUIRED: with SPANNER_EMULATOR_HOST
      # unset and CI set, the suite fails rather than skipping. "Emulator
      # down, tests skipped, all green" proves nothing.
      spanner-emulator:
        # 1.5.25 has a concurrency bug ("Invalid transaction ID. Transaction
        # ID must be >= 17") under parallel read-write transactions — found by
        # this suite's race tests on CI's first run. 1.5.52 verified against
        # the same conformance suite in docker before pinning.
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.52
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      # Pinned by commit, not tag: a tag can be moved. Dependabot bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The bundle is generated here, not committed: go:embed reads web/dist
      # at build time, so node comes before the first go command. It was
      # committed for a month; see web/embed.go for why that stopped.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # hack/check.sh is THE check: this job and the factory's own gate
      # (internal/daemon/daemon.go, gate.Command) run this exact script, so
      # CI and the gate cannot drift into checking different things the way
      # d9b4607 showed they could.
      - run: ./hack/check.sh
