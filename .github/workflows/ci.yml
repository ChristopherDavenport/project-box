# Every gate blocks, and this file is itself under change control — the claim
# "our storage properties are asserted on every backend on every commit" is a
# control, and controls have to be sampleable.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The Spanner conformance leg is REQUIRED: with SPANNER_EMULATOR_HOST
      # unset and CI set, the suite fails rather than skipping. "Emulator
      # down, tests skipped, all green" proves nothing.
      spanner-emulator:
        # 1.5.25 has a concurrency bug ("Invalid transaction ID. Transaction
        # ID must be >= 17") under parallel read-write transactions — found by
        # this suite's race tests on CI's first run. 1.5.52 verified against
        # the same conformance suite in docker before pinning.
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.52
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # web/dist is committed because go:embed makes it a SOURCE INPUT to the Go
  # build: without it `go build`, `go install`, and the one-binary property all
  # break, and CI would need node to test the daemon at all. That is the right
  # trade and it stays.
  #
  # What was missing is the other half. A generated artifact nobody verifies is
  # exactly the unverified claim this repo refuses everywhere else — src could
  # drift from dist silently, and the shipped binary would serve a UI nobody
  # reviewed, with a 190KB minified diff no reviewer can read standing in for
  # the evidence. The build is byte-reproducible, so checking it is cheap.
  #
  # This is a separate job on purpose: the daemon's own gates above still need
  # no node.
  web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: rebuild the bundle
        working-directory: web
        run: npm run build
      - name: dist must match src
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "web/dist does not match a rebuild from web/src."
            echo "Run 'cd web && npm ci && npm run build' and commit the result."
            git diff --stat -- web/dist
            exit 1
          fi
